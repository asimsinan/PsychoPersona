calibration:
  donor_pool_min: 20
  enabled: false
  neighbor_count: 8
  profile_shrinkage: 0.25
  save_raw_outputs: true
  signal_scale: 0.6
  strategy: direct
dataset:
  audit_reference: null
  dataset_id: bangladesh_sns
  feature_descriptors:
    digital_addiction_mean:
      high_text: daha yüksek dijital kullanım
      label: Dijital bağımlılık ortalaması
      low_text: daha düşük dijital kullanım
    gad7_mean:
      high_text: higher anxiety symptoms
      label: GAD-7 anxiety mean
      low_text: lower anxiety symptoms
    phq9_mean:
      high_text: higher depressive symptoms
      label: PHQ-9 depression mean
      low_text: lower depressive symptoms
    social_anxiety_mean:
      high_text: daha yüksek sosyal kaygı
      label: Sosyal kaygı ortalaması
      low_text: daha düşük sosyal kaygı
    ucla_loneliness_mean:
      high_text: higher loneliness
      label: UCLA-8 loneliness mean
      low_text: lower loneliness
    usage_hours_midpoint:
      high_text: heavier daily social-media use
      label: Daily social-media hours midpoint
      low_text: lighter daily social-media use
    wellbeing_mean:
      high_text: daha yüksek iyi oluş
      label: İyi oluş ortalaması
      low_text: daha düşük iyi oluş
  file_format: xlsx
  locale: en
  metadata_fields:
  - include_in_context: false
    label: Timestamp
    name: timestamp
    source_column: Timestamp
    transform: text
    value_map: {}
  - include_in_context: true
    label: Age band
    name: age_band
    source_column: 21. Please write your age in years (number).
    transform: age_band_default
    value_map: {}
  - include_in_context: true
    label: Gender
    name: gender
    source_column: 22. Gender
    transform: text
    value_map: {}
  - include_in_context: true
    label: Education
    name: education
    source_column: 25. Education
    transform: mapped_text
    value_map:
      Graduate Level: Graduate or above
      Graduate or above: Graduate or above
      Higher secondary level: Higher secondary
      Masters or above: Graduate or above
      Primary level: Primary
      Secondary Level: Secondary
  - include_in_context: true
    label: Profession
    name: profession
    source_column: 26. Profession
    transform: mapped_text
    value_map:
      Author: Other
      Bekar: Student / unemployed
      Business+student: Business / student
      Businessman: Business
      Daily labor/driver/housemaid: Other
      'Dental surgeon ': Healthcare
      'Dentist ': Healthcare
      Doctor: Healthcare
      'Doctor ': Healthcare
      Govt. job: Government job
      Hhousewife: Homemaker
      'Home tutor ': Other
      'Homemaker ': Homemaker
      'House  wife ': Homemaker
      Housemaker: Homemaker
      Housewife: Homemaker
      'Housewife ': Homemaker
      I don't wanna do any job: Other
      Intern doctor: Healthcare
      'No': Student / unemployed
      Private job: Private job
      Private job and self taught makeup artist: Private job
      Recently unemployed, now housewife: Homemaker
      Self-employed/Entrepreneur/Business: Business
      Student: Student
      'Student ': Student
      TA: Other
      'Teacher ': Teacher
      Unemployed including students: Student / unemployed
      Used to work and now searching for job.: Other
      doctor: Healthcare
      housewife: Homemaker
  - include_in_context: true
    label: Monthly income
    name: monthly_income
    source_column: 27. Monthly income
    transform: text
    value_map: {}
  - include_in_context: true
    label: Residence area
    name: residence
    source_column: 28. Area of residence
    transform: text
    value_map: {}
  - include_in_context: true
    label: Primary social platform
    name: primary_platform
    source_column: 2. Which social media account do you use usually?
    transform: mapped_text
    value_map:
      Facebook: Facebook
      Imo: Imo
      Instagram: Instagram
      Snapchat: Snapchat
      Tiktok: TikTok
      'Tiktok ': TikTok
      Twitter: Twitter
      WeChat: WeChat
      WhatsApp: WhatsApp
      imo: Imo
  - include_in_context: true
    label: Daily social-media use
    name: usage_band
    source_column: 7. How much time do you spend daily in social media?
    transform: text
    value_map: {}
  - include_in_context: true
    label: Daily social-media hours midpoint
    name: usage_hours_midpoint
    source_column: 7. How much time do you spend daily in social media?
    transform: mapped_number
    value_map:
      1-3 hours: 2.0
      3-5 hours: 4.0
      Less than 1 hour: 0.5
      More than 5 hours: 6.0
  profile_anchor_columns:
  - gender
  - education
  - usage_band
  regression_pairs:
  - name: gad7_on_phq9
    x: phq9_mean
    y: gad7_mean
  - name: ucla_on_phq9
    x: phq9_mean
    y: ucla_loneliness_mean
  response_max: 3
  response_min: 0
  scales:
  - item_columns:
    - ucla_item_01
    - ucla_item_02
    - ucla_item_03
    - ucla_item_04
    - ucla_item_05
    - ucla_item_06
    - ucla_item_07
    - ucla_item_08
    item_response_maps: {}
    item_transforms: {}
    label: UCLA-8 loneliness mean
    mean_column: ucla_loneliness_mean
    name: ucla_loneliness
    raw_columns:
    - 1. In the past 30 days, do you feel lack of companionship?
    - 2. In the past 30 days, there is no one I can turn to
    - 3. In the past 30 days, I feel left out.
    - 4. In the last 30 days, I feel isolated from others.
    - 5. In the last 30 days, I am unhappy being so withdrawn.
    - 6. In the last 30 days, people are around me but not with me.
    - 7. In the last 30 days, I am an outgoing person.
    - 8. In the last 30 days, I can find companionship when I want it.
    response_map:
      Never: 0.0
      Often: 3.0
      Rarely: 1.0
      Sometimes: 2.0
    reverse_item_columns:
    - ucla_item_07
    - ucla_item_08
    shift_key: ucla
  - item_columns:
    - phq9_item_01
    - phq9_item_02
    - phq9_item_03
    - phq9_item_04
    - phq9_item_05
    - phq9_item_06
    - phq9_item_07
    - phq9_item_08
    - phq9_item_09
    item_response_maps: {}
    item_transforms: {}
    label: PHQ-9 depression mean
    mean_column: phq9_mean
    name: phq9
    raw_columns:
    - 1 In the last 30 days, little interest or pleasure in doing things.
    - 2. In the last 30 days, feeling down, depressed or hopeless.
    - 3. In the last 30 days, trouble falling or staying asleep, sleeping too much
    - 4. In the last 30 days, Feeling tired or having little energy.
    - 5. In the last 30 days, poor appetite or over-eating.
    - 6. In the last 30 days, feeling bad about yourself-or that you are a failure
      or have let yourself or your family down.
    - 7. In the last 30 days, trouble concentrating on things, such as reading the
      newspaper or watching television.
    - 8. In the last 30 days, moving or speaking so slowly or the opposite-moving
      around a lot more than usual.
    - 9. In the last 30 days, thoughts that you would be better off dead, or of hurting
      yourself.
    response_map:
      Half days: 2.0
      Half of days: 2.0
      More than half of the days: 2.0
      Nearly every day: 3.0
      Nearly everyday: 3.0
      Not at all: 0.0
      Several days: 1.0
    reverse_item_columns: []
    shift_key: phq9
  - item_columns:
    - gad7_item_01
    - gad7_item_02
    - gad7_item_03
    - gad7_item_04
    - gad7_item_05
    - gad7_item_06
    - gad7_item_07
    item_response_maps: {}
    item_transforms: {}
    label: GAD-7 anxiety mean
    mean_column: gad7_mean
    name: gad7
    raw_columns:
    - 1. In the last 30 days, I am feeling nervous, anxious, or on edge
    - 2. In the last 30 days, I an not being able to stop or control worrying
    - 3. In the last 30 days, I am worrying too much about different things.
    - 4. In the last 30 days, I felt trouble in relaxing.
    - 5. In the last 30 days, I am being so restless that it's hard to sit still
    - 6. In the last 30 days, I becoming easily annoyed or irritable.
    - 7. In the last 30 days, I am feeling afraid as if something awful might happen.
    response_map:
      Half days: 2.0
      Half of days: 2.0
      More than half of the days: 2.0
      Nearly every day: 3.0
      Nearly everyday: 3.0
      Not at all: 0.0
      Several days: 1.0
    reverse_item_columns: []
    shift_key: gad7
  sheet_name: Raw Data
  stratify_categorical_columns:
  - gender
  - education
  - usage_band
  stratify_score_columns:
  - phq9_mean
  - gad7_mean
  subgroup_columns:
  - gender
  - education
  - usage_band
dataset_path: /workspace/PsychoPersona/datasets/bangladesh_sns/mmc2.xlsx
lmstudio:
  api_key: null
  api_key_env: OPENROUTER_API_KEY
  base_url: https://openrouter.ai/api/v1
  headers:
    HTTP-Referer: https://example.org
    X-OpenRouter-Title: SaykoPersona
  model_id: google/gemini-3.1-pro-preview
  ordinal:
    max_tokens: 1
    name: ordinal
    temperature: 0.0
    top_p: 1.0
  persona:
    max_tokens: 1100
    name: persona_card
    temperature: 0.2
    top_p: 1.0
  primary:
    max_tokens: 1200
    name: primary
    temperature: 0.15
    top_p: 1.0
  stability:
    max_tokens: 1200
    name: stability
    temperature: 0.15
    top_p: 1.0
output_root: /workspace/PsychoPersona/results
paper_path: prior_study_extract.pdf
profiles:
  assignment: coldstart
  cluster_max: 6
  cluster_min: 2
  feature_columns:
  - ucla_loneliness_mean
  - phq9_mean
  - gad7_mean
simulation:
  evaluation_split: final_test
  item_scoring_mode: argmax
  max_holdout_rows: null
  parallel_workers: 4
  prompt_version: direct_stats_two_pass_v1
  response_mode: direct_json
  self_consistency_samples: 1
  stability_runs: 3
  trait_plan_samples: 1
split:
  final_test_size: 0.1
  random_state: 42
  validation_size: 0.1
