calibration:
  donor_pool_min: 20
  enabled: false
  neighbor_count: 8
  profile_shrinkage: 0.25
  save_raw_outputs: true
  signal_scale: 0.6
  strategy: direct
dataset:
  audit_reference:
    expected_category_counts:
      gender:
        Erkek: 334
        Kadın: 335
      program:
        Lisans: 260
        Ön lisans: 409
      usage_band:
        0-3 saat: 200
        10 saat ve üzeri: 33
        4-6 saat: 352
        7-9 saat: 84
    note: Original Turkish paper benchmark reference.
    paper_sample_size: 669
  dataset_id: anket_tr
  feature_descriptors:
    digital_addiction_mean:
      high_text: daha yüksek dijital kullanım
      label: Dijital bağımlılık ortalaması
      low_text: daha düşük dijital kullanım
    social_anxiety_mean:
      high_text: daha yüksek sosyal kaygı
      label: Sosyal kaygı ortalaması
      low_text: daha düşük sosyal kaygı
    usage_hours_midpoint:
      high_text: daha yüksek günlük medya kullanımı
      label: Günlük medya kullanım süresi orta noktası
      low_text: daha düşük günlük medya kullanımı
    wellbeing_mean:
      high_text: daha yüksek iyi oluş
      label: İyi oluş ortalaması
      low_text: daha düşük iyi oluş
  file_format: xlsx
  locale: tr
  metadata_fields:
  - include_in_context: false
    label: Zaman damgası
    name: timestamp
    source_column: Zaman damgası
    transform: text
    value_map: {}
  - include_in_context: true
    label: Cinsiyet
    name: gender
    source_column: 'Cinsiyetiniz:'
    transform: text
    value_map: {}
  - include_in_context: true
    label: Yaş grubu
    name: age_band
    source_column: Yaşınız
    transform: age_band_default
    value_map: {}
  - include_in_context: true
    label: Program
    name: program
    source_column: Eğitim gördüğünüz program
    transform: program_tr
    value_map: {}
  - include_in_context: true
    label: Not ortalaması aralığı
    name: gpa_band
    source_column: Genel Not Ortalamanız
    transform: text
    value_map: {}
  - include_in_context: true
    label: Kalınan yer
    name: residence
    source_column: Üniversite okurken kaldığınız yer
    transform: text
    value_map: {}
  - include_in_context: true
    label: Sık kullanılan platformlar
    name: platforms
    source_column: Dijital araçlarla en çok hangi platformu/platformları kullanıyorsunuz?
      (1'den fazla seçebilirsiniz)
    transform: text
    value_map: {}
  - include_in_context: true
    label: Günlük medya kullanım aralığı
    name: usage_band
    source_column: Dijital medya araçları (sosyal medya, web siteleri, radyo, tv,
      podcast, dijital dizi/film vb.) ile günde ortalama kaç saat vakit geçiriyorsunuz?
    transform: text
    value_map: {}
  - include_in_context: true
    label: Günlük medya kullanım süresi orta noktası
    name: usage_hours_midpoint
    source_column: Dijital medya araçları (sosyal medya, web siteleri, radyo, tv,
      podcast, dijital dizi/film vb.) ile günde ortalama kaç saat vakit geçiriyorsunuz?
    transform: mapped_number
    value_map:
      0-3 saat: 1.5
      1-2 saat: 1.5
      10 saat ve üzeri: 10.0
      4-6 saat: 5.0
      7-9 saat: 8.0
  profile_anchor_columns:
  - gender
  - program
  - usage_band
  regression_pairs:
  - name: social_anxiety_on_digital
    x: digital_addiction_mean
    y: social_anxiety_mean
  - name: wellbeing_on_digital
    x: digital_addiction_mean
    y: wellbeing_mean
  response_max: 5
  response_min: 1
  scales:
  - item_columns:
    - digital_item_01
    - digital_item_02
    - digital_item_03
    - digital_item_04
    - digital_item_05
    - digital_item_06
    - digital_item_07
    - digital_item_08
    - digital_item_09
    - digital_item_10
    item_response_maps: {}
    item_transforms: {}
    label: Dijital bağımlılık ortalaması
    mean_column: digital_addiction_mean
    name: digital_addiction
    raw_columns:
    - ' [Uyumadan önce yataktayken, dijital cihazımda oyun oynar veya mesajlaşırım.]'
    - ' [Dijital cihazlarımı kullanamazsam sıkılırım.]'
    - ' [Dijital cihazları kullanmayı planlandığımdan daha çok zaman ayırıyorum.]'
    - ' [Dijital cihazlarımı bir yere bıraktığımda, tekrar kullanma isteği duyuyorum.]'
    - ' [Yemek yerken dijital cihazlarımı kullanırım.]'
    - ' [Sokakta yürürken dijital cihazımda oyun oynar veya mesajlaşırım.]'
    - ' [Birisiyle sohbet ederken bile, gözüm dijital cihazımdadır.]'
    - ' [Dijital cihazlarımı kullanmazsam huysuz biri olurum.]'
    - ' [Arkadaşlarımın sosyal medyada ne yazdığını bilmediğimde huzursuz hissederim.]'
    - ' [Dersler sırasında dijital cihazım üzerinden gözümü ayırmam.]'
    response_map:
      Kararsızım: 3.0
      Katılmıyorum: 2.0
      Katılıyorum: 4.0
      Kesinlikle Katılmıyorum: 1.0
      Tamamen Katılıyorum: 5.0
    reverse_item_columns: []
    shift_key: digital
  - item_columns:
    - social_item_01
    - social_item_02
    - social_item_03
    - social_item_04
    - social_item_05
    - social_item_06
    - social_item_07
    - social_item_08
    - social_item_09
    - social_item_10
    - social_item_11
    - social_item_12
    item_response_maps: {}
    item_transforms: {}
    label: Sosyal kaygı ortalaması
    mean_column: social_anxiety_mean
    name: social_anxiety
    raw_columns:
    - ' [Başkalarının benim hakkımda ne söyleyeceğinden endişelenirim.]'
    - ' [Başkalarının benden hoşlanmayacağından endişelenirim.]'
    - ' [Başkalarının benden hoşlanmayacağından korkarım.]'
    - ' [Başkalarının benim hakkımda ne düşündüğünden endişelenirim.]'
    - ' [Yeni insanlarla tanıştığımda tedirgin olurum.]'
    - ' [Tanımadığım insanların yanında utanırım.]'
    - ' [Çok iyi tanımadığım insanlarla konuşurken tedirgin olurum.]'
    - ' [Bazı insanların yanındayken tedirgin olurum.]'
    - ' [Başkalarından benimle bir şeyler yapmalarını istemekte zorlanırım.]'
    - ' [Başkaları hayır diyebilirler diye benimle bir şeyler yapmalarını teklif etmeye
      çekinirim (Ör: sinemaya gitmek gibi).]'
    - ' [Bir grup insanla beraberken durgun olurum.]'
    - ' [İyi tanıdığım insanların yanındayken bile utanırım.]'
    response_map:
      Kararsızım: 3.0
      Katılmıyorum: 2.0
      Katılıyorum: 4.0
      Kesinlikle Katılmıyorum: 1.0
      Tamamen Katılıyorum: 5.0
    reverse_item_columns: []
    shift_key: social
  - item_columns:
    - wellbeing_item_01
    - wellbeing_item_02
    - wellbeing_item_03
    - wellbeing_item_04
    - wellbeing_item_05
    - wellbeing_item_06
    - wellbeing_item_07
    - wellbeing_item_08
    item_response_maps: {}
    item_transforms: {}
    label: İyi oluş ortalaması
    mean_column: wellbeing_mean
    name: wellbeing
    raw_columns:
    - Lütfen aşağıdaki önermeleri size en uygun olacak şekilde işaretleyiniz. [Amaçlı
      ve anlamlı bir yaşam sürdürüyorum.]
    - Lütfen aşağıdaki önermeleri size en uygun olacak şekilde işaretleyiniz. [Sosyal
      ilişkilerim destekleyici ve tatmin edicidir.]
    - Lütfen aşağıdaki önermeleri size en uygun olacak şekilde işaretleyiniz. [Günlük
      aktivitelerime bağlı ve ilgiliyim.]
    - Lütfen aşağıdaki önermeleri size en uygun olacak şekilde işaretleyiniz. [Başkalarının
      mutlu ve iyi olmasına aktif olarak katkıda bulunurum.]
    - Lütfen aşağıdaki önermeleri size en uygun olacak şekilde işaretleyiniz. [Benim
      için önemli olan etkinliklerde yetenekli ve yeterliyim.]
    - Lütfen aşağıdaki önermeleri size en uygun olacak şekilde işaretleyiniz. [Ben
      iyi bir insanım ve iyi bir hayat yaşıyorum.]
    - Lütfen aşağıdaki önermeleri size en uygun olacak şekilde işaretleyiniz. [Geleceğim
      hakkında iyimserim.]
    - Lütfen aşağıdaki önermeleri size en uygun olacak şekilde işaretleyiniz. [İnsanlar
      bana saygı duyar.]
    response_map:
      Kararsızım: 3.0
      Katılmıyorum: 2.0
      Katılıyorum: 4.0
      Kesinlikle Katılmıyorum: 1.0
      Tamamen Katılıyorum: 5.0
    reverse_item_columns: []
    shift_key: wellbeing
  sheet_name: null
  stratify_categorical_columns:
  - gender
  - program
  - usage_band
  stratify_score_columns:
  - digital_addiction_mean
  - wellbeing_mean
  subgroup_columns:
  - gender
  - program
  - usage_band
dataset_path: /workspace/PsychoPersona/anket.xlsx
lmstudio:
  api_key: null
  api_key_env: OPENROUTER_API_KEY
  base_url: https://openrouter.ai/api/v1
  headers:
    HTTP-Referer: https://example.org
    X-OpenRouter-Title: SaykoPersona
  model_id: anthropic/claude-opus-4.6
  ordinal:
    max_tokens: 1
    name: ordinal
    temperature: 0.0
    top_p: 1.0
  persona:
    max_tokens: 1100
    name: persona_card
    temperature: 0.2
    top_p: 1.0
  primary:
    max_tokens: 600
    name: primary
    temperature: 0.15
    top_p: 1.0
  stability:
    max_tokens: 600
    name: stability
    temperature: 0.15
    top_p: 1.0
output_root: /workspace/PsychoPersona/results
paper_path: prior_study_extract.pdf
profiles:
  assignment: coldstart
  cluster_max: 6
  cluster_min: 2
  feature_columns:
  - digital_addiction_mean
  - social_anxiety_mean
  - wellbeing_mean
simulation:
  evaluation_split: final_test
  item_scoring_mode: argmax
  max_holdout_rows: null
  parallel_workers: 4
  prompt_version: direct_stats_two_pass_v1
  response_mode: direct_json
  self_consistency_samples: 1
  stability_runs: 3
  trait_plan_samples: 1
split:
  final_test_size: 0.1
  random_state: 42
  validation_size: 0.1
