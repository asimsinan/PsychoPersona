dataset_path: ../../anket.xlsx
paper_path: prior_study_extract.pdf
output_root: ../../results
split:
  validation_size: 0.1
  final_test_size: 0.1
  random_state: 42
profiles:
  cluster_min: 2
  cluster_max: 6
  feature_columns:
  - digital_addiction_mean
  - social_anxiety_mean
  - wellbeing_mean
lmstudio:
  base_url: http://127.0.0.1:1234/v1
  primary:
    name: primary
    temperature: 0.25
    max_tokens: 600
    top_p: 0.9
  persona:
    name: persona_card
    temperature: 0.2
    max_tokens: 1100
    top_p: 1.0
  stability:
    name: stability
    temperature: 0.2
    max_tokens: 600
    top_p: 1.0
simulation:
  prompt_version: v2_tr
  max_holdout_rows: null
  stability_runs: 3
  parallel_workers: 4
  evaluation_split: validation
