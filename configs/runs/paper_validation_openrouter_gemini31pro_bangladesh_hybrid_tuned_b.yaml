dataset_path: ../../datasets/bangladesh_sns/mmc2.xlsx
paper_path: prior_study_extract.pdf
output_root: ../../results
dataset: bangladesh_sns
split:
  validation_size: 0.1
  final_test_size: 0.1
  random_state: 42
profiles:
  cluster_min: 2
  cluster_max: 6
  feature_columns:
  - ucla_loneliness_mean
  - phq9_mean
  - gad7_mean
lmstudio:
  base_url: https://openrouter.ai/api/v1
  model_id: google/gemini-3.1-pro-preview
  api_key_env: OPENROUTER_API_KEY
  headers:
    HTTP-Referer: https://example.org
    X-OpenRouter-Title: SaykoPersona
  primary:
    name: primary
    temperature: 0.1
    max_tokens: 300
    top_p: 1.0
  persona:
    name: persona_card
    temperature: 0.2
    max_tokens: 1100
    top_p: 1.0
  stability:
    name: stability
    temperature: 0.1
    max_tokens: 300
    top_p: 1.0
simulation:
  prompt_version: v4_tr_hybrid_b
  max_holdout_rows: null
  stability_runs: 3
  parallel_workers: 4
  evaluation_split: validation
calibration:
  enabled: true
  strategy: hybrid_llm
  donor_pool_min: 20
  profile_shrinkage: 0.25
  signal_scale: 0.25
  neighbor_count: 8
  save_raw_outputs: true
