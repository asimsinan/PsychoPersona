calibration:
  donor_pool_min: 20
  enabled: true
  neighbor_count: 8
  profile_shrinkage: 0.25
  save_raw_outputs: true
  signal_scale: 0.25
  strategy: hybrid_llm
dataset_path: ../../../anket.xlsx
lmstudio:
  api_key_env: OPENROUTER_API_KEY
  base_url: https://openrouter.ai/api/v1
  headers:
    HTTP-Referer: https://example.org
    X-OpenRouter-Title: SaykoPersona
  model_id: openai/gpt-5.4
  persona:
    max_tokens: 1100
    name: persona_card
    temperature: 0.2
    top_p: 1.0
  primary:
    max_tokens: 300
    name: primary
    temperature: 0.1
    top_p: 1.0
  stability:
    max_tokens: 300
    name: stability
    temperature: 0.1
    top_p: 1.0
output_root: ../../../results
paper_path: prior_study_extract.pdf
profiles:
  cluster_max: 6
  cluster_min: 2
  feature_columns:
  - digital_addiction_mean
  - social_anxiety_mean
  - wellbeing_mean
simulation:
  evaluation_split: final_test
  max_holdout_rows: null
  parallel_workers: 4
  prompt_version: v4_tr_hybrid_b
  stability_runs: 0
split:
  final_test_size: 0.1
  random_state: 110
  validation_size: 0.1
