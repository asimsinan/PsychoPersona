[project]
name = "saykopersona"
version = "0.1.0"
description = "Standalone LLM persona research pipeline for the SaykoPersona study"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "tenacity>=9.1.4",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[project.scripts]
saykopersona = "saykopersona:main"
saykopersona-experiment = "saykopersona.experiment:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
